name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: katsukura
          POSTGRES_PASSWORD: katsukura
          POSTGRES_DB: katsukura
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U katsukura -d katsukura"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://katsukura:katsukura@localhost:5432/katsukura?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: webui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make webui-check webui-test webui-build
      - run: make test test-integration lint
      - run: go build ./cmd/server
