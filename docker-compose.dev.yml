services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: katsukura
      POSTGRES_PASSWORD: katsukura
      POSTGRES_DB: katsukura
    ports:
      - "127.0.0.1:5438:5432"
    volumes:
      - katsukura-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U katsukura -d katsukura"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  katsukura-postgres:
